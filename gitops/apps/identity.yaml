apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: identity
  namespace: openshift-gitops
spec:
  project: default
  source:
    repoURL: https://github.com/Imran0808/openshift-azure-lab.git
    targetRevision: main
    path: platform/identity
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
